name: CI

on:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Guard against machine-local registry URLs in the lockfile
        run: |
          if grep -nE '127\.0\.0\.1|localhost' package-lock.json; then
            echo "::error::package-lock.json contains a machine-local registry URL."
            echo "Regenerate the lockfile against the public npm registry before committing."
            exit 1
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}
          SITE_URL: https://${{ github.repository_owner }}.github.io
